<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nieuwe rij toevoegen</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav>
        <ul>
            <li><a href="{{ url_for('index') }}">Home</a></li>
            <li><a href="{{ url_for('data') }}">Data</a></li>
            <li><a href="{{ url_for('toevoegen') }}">Toevoegen</a></li>
            <li><a href="{{ url_for('laad_basisdata') }}">Laad basisdata</a></li>
        </ul>
    </nav>

    <h1>Nieuwe rij toevoegen</h1>
    <p>Vul het formulier in; de gegevens worden opgeslagen in de database.</p>

    <form method="POST" action="{{ url_for('toevoegen') }}">
        <label for="naam">Naam:</label><br>
        <input type="text" id="naam" name="naam" required><br><br>

        <label for="beschrijving">Beschrijving:</label><br>
        <textarea id="beschrijving" name="beschrijving"></textarea><br><br>

        <button type="submit">Opslaan</button>
    </form>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
